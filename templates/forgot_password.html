<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Forgot password · Attendance Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
  <div class="login-wrap">
    <section class="login-panel paper">
      <p class="brand-kicker">Password help</p>
      <h1>Forgot password</h1>
      <p class="lede">Enter your username or registered email. We send a one-time link to that inbox. After you set a new password, sign in again.</p>
      <form method="post" class="stack">
        <label>
          Username or email
          <input type="text" name="identifier" required autocomplete="username">
        </label>
        <button class="btn primary" type="submit">Send reset link</button>
      </form>
      <p class="auth-link"><a href="{{ url_for('login') }}">Back to sign in</a></p>
    </section>
  </div>
</body>
</html>
